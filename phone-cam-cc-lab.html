<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071326">
  <title>CC LAB · Камера телефона</title>
  <style>
    *{box-sizing:border-box}html,body{height:100%;margin:0}body{display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 50% 0,#17345c,#060b17 58%);color:#eafffb;font:15px/1.55 system-ui,sans-serif}.card{width:min(460px,100%);padding:24px;border:1px solid #b8f5ff24;border-radius:24px;background:#071326e8;box-shadow:0 30px 90px #0008}.eyebrow{color:#74e9d5;font-size:11px;font-weight:800;letter-spacing:.2em}.preview{position:relative;aspect-ratio:9/16;margin:18px 0;border-radius:18px;overflow:hidden;background:#020610;border:1px solid #fff1}video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}.preview:after{content:"";position:absolute;inset:10%;border:1px dashed #7df4df66;border-radius:45% 45% 24% 24%;pointer-events:none}.row{display:flex;gap:9px}input,button{min-height:48px;border-radius:14px;font:700 16px system-ui}input{min-width:0;flex:1;padding:0 15px;color:#fff;background:#0d203a;border:1px solid #8ddfd655;letter-spacing:.28em;text-align:center}button{padding:0 18px;border:0;color:#041016;background:linear-gradient(135deg,#9ff7ea,#4cded1,#9b8cff);cursor:pointer}button:disabled{opacity:.45}#status{min-height:46px;margin:14px 0 0;color:#94abc5}.ok{color:#6ef0b2!important}.warn{color:#ffc56b!important}.note{color:#7187a2;font-size:12px}
  </style>
</head>
<body>
  <main class="card">
    <div class="eyebrow">CC LAB · REMOTE CAMERA</div>
    <h1>Камера телефона</h1>
    <p>Введите четырёхзначный код с экрана игры. Не блокируйте телефон во время боя.</p>
    <div class="preview"><video id="preview" playsinline muted autoplay></video></div>
    <div class="row"><input id="code" inputmode="numeric" maxlength="4" placeholder="КОД" aria-label="Код подключения"><button id="connect">Подключить</button></div>
    <p id="status" role="status">Камера включится только после нажатия.</p>
    <p class="note">Страница должна быть открыта через HTTPS. Для устойчивого захвата закрепите телефон горизонтально и поставьте перед собой.</p>
  </main>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script>
    const video=document.getElementById('preview'),code=document.getElementById('code'),button=document.getElementById('connect'),status=document.getElementById('status');let stream,peer,call;
    function say(text,type=''){status.textContent=text;status.className=type}
    button.onclick=async()=>{const pin=code.value.replace(/\D/g,'');if(pin.length!==4){say('Введите 4 цифры с экрана игры.','warn');return}button.disabled=true;say('Запрашиваю камеру…');try{stream=stream||await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1280},height:{ideal:720},frameRate:{ideal:30}},audio:false});video.srcObject=stream;peer?.destroy();peer=new Peer();await new Promise((resolve,reject)=>{peer.on('open',resolve);peer.on('error',reject)});call=peer.call('mb-'+pin,stream);call.on('close',()=>say('Игра завершила соединение.','warn'));call.on('error',e=>say('Ошибка соединения: '+e.message,'warn'));say('Подключено. Вернитесь к экрану игры.','ok')}catch(e){say(e.name==='NotAllowedError'?'Разрешите доступ к камере в настройках браузера.':'Не удалось подключиться: '+e.message,'warn')}finally{button.disabled=false}};
    addEventListener('pagehide',()=>{call?.close();peer?.destroy();stream?.getTracks().forEach(t=>t.stop())});
  </script>
</body>
</html>
